site_name: Rokita Lab and BTI Bioinformatics Documentation
repo_url: https://github.com/childrens-bti/bti-bfx-docs
repo_name: childrens-bti/bti-bfx-docs
edit_uri: edit/main/docs/
plugins:
  - search
  - git-revision-date-localized:
      type: date
      exclude:
        - access.md
        - aws.md
        - cavatica.md
        - cnh-onboarding.md
        - code-review-guide.md
        - codex.md
        - docker.md
        - docs-resources.md
        - github-general.md
        - github-pr-guide.md
        - github-repo-guide.md
        - github-tokens.md
        - index.md
        - literature.md
        - pi-services.md
        - pi-working-with-core.md
        - project-mgmt.md
        - sop-cwl-cavatica.md
        - sprints.md
        - vs-code.md
nav:
  - Home: index.md
  - Onboarding:
      - CNH-Specific Onboarding: cnh-onboarding.md
      - Technology Access Requests: access.md
  - Compute:
      - AWS Compute: aws.md
      - Using Codex: codex.md
      - CAVATICA Compute: cavatica.md
      - CAVATICA workflow SOP: sop-cwl-cavatica.md
      - Using Docker or Podman: docker.md
  - GitHub and Code Review:
      - Using GitHub: github-general.md
      - GitHub Repository Guidelines: github-repo-guide.md
      - GitHub Pull Request Guidelines: github-pr-guide.md
      - Code Review Guidelines: code-review-guide.md
      - Using VS Code for Code Reviews: vs-code.md
      - Github Tokens: github-tokens.md
  - Team and Project Management:
      - Project Management: project-mgmt.md
      - Sprint Planning: sprints.md
  - For Principal Investigators:
      - Working with the Core: pi-working-with-core.md
      - Services: pi-services.md
      - Authorship Guidelines: pi-authorship-guidelines.md
  - Resources:
      - Literature: literature.md
      - Docs: docs-resources.md
theme:
  name: material
  custom_dir: overrides
  variant: modern
  font:
    text: Barlow
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
    - toc.integrate
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
