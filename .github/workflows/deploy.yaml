name: Deploy Website
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.x
      - run: pip install zensical ghp-import
      - run: zensical build --clean
      - run: ghp-import --push --force --no-jekyll -m "Deployed ${{ github.sha }} with Zensical" -b gh-pages site

